
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="224" viewBox="0 0 300 224" fill="none">
  <style>
    @keyframes cursor-blink {
      0%, 49.99% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .cursor {
      animation: cursor-blink 1.4s steps(1, end) infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <!-- Browser window -->
  <rect
    x="1"
    y="1"
    width="298"
    height="222"
    rx="11"
    fill="#FFFFFF"
    stroke="#D5D5D5"
    stroke-width="1.5"
  />

  <!-- Title bar divider -->
  <path d="M2 30H298" stroke="#D5D5D5" stroke-width="1.5"/>

  <!-- Window controls -->
  <circle cx="16" cy="15" r="3.5" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.2"/>
  <circle cx="28" cy="15" r="3.5" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.2"/>
  <circle cx="40" cy="15" r="3.5" fill="#FFFFFF" stroke="#D2D2D2" stroke-width="1.2"/>

  <!-- Character -->
  <text
    x="22"
    y="74"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#C4C4C4"
  >&lt;</text>

  <!-- Blinking cursor -->
  <rect
    class="cursor"
    x="30"
    y="65"
    width="1.5"
    height="10"
    rx="0.75"
    fill="#B8B8B8"
  />
</svg>
